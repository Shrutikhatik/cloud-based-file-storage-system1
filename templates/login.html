<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cloud Based File Storage System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.login-page {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #edf3ff, #f7f9ff);
            color: #172b4d;
        }
        .login-card {
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
            padding: 36px;
            background: #fff;
            border: 1px solid #e4eaf5;
            border-radius: 22px;
            box-shadow: 0 18px 55px rgba(30, 55, 100, .12);
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            color: #172b4d;
            text-decoration: none;
            font-size: 23px;
            font-weight: 800;
        }
        .login-logo { color: #4164ed; font-size: 35px; }
        .login-icon {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: #edf2ff;
            color: #4164ed;
            font-size: 26px;
            margin-bottom: 20px;
        }
        .login-card h1 { margin: 0 0 10px; font-size: 29px; }
        .login-subtitle { margin: 0 0 25px; color: #8390a5; line-height: 1.6; }
        .login-form { display: grid; gap: 17px; }
        .login-form label { display: grid; gap: 9px; font-size: 13px; font-weight: 700; }
        .login-form input[type="email"],
        .login-form input[type="password"],
        .login-form input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #dfe6f1;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }
        .login-form input:focus { border-color: #4164ed; box-shadow: 0 0 0 3px #4164ed18; }
        .show-password { display: flex !important; grid-template-columns: none !important; flex-direction: row; align-items: center; gap: 9px !important; font-weight: 400 !important; }
        .show-password input { width: 16px; height: 16px; }
        .login-button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 15px;
            background: #4164ed;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .login-button:hover { background: #2f50d5; }
        .login-alert { padding: 12px; margin-bottom: 12px; border-radius: 9px; font-size: 13px; }
        .login-alert.danger { background: #fff0f0; color: #b42332; }
        .login-alert.warning { background: #fff7df; color: #8a6500; }
        .login-alert.success { background: #e7f8ee; color: #087a4b; }
        .login-footer { margin-top: 23px; text-align: center; color: #7c899d; font-size: 13px; }
        .login-footer a { color: #4164ed; text-decoration: none; font-weight: 700; }
        .login-security { margin-top: 24px; padding-top: 17px; border-top: 1px solid #edf0f6; text-align: center; color: #8793a7; font-size: 12px; }
        @media(max-width:480px) { .login-card { padding: 25px 20px; } }
    </style>
</head>
<body class="login-page">
    <main class="login-card">
        <a class="login-brand" href="{{ url_for('login') }}">
            <span class="login-logo">☁</span>
            <span>CloudStore</span>
        </a>

        <div class="login-icon">↗</div>
        <h1>Welcome back!</h1>
        <p class="login-subtitle">Sign in to access your cloud workspace.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="login-alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form class="login-form" method="POST" action="{{ url_for('login') }}">
            <label for="email">Email Address
                <input id="email" type="email" name="email"
                       placeholder="you@example.com"
                       autocomplete="email" required>
            </label>

            <label for="password">Password
                <input id="password" type="password" name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>
            </label>

            <label class="show-password">
                <input type="checkbox" id="showPassword">
                Show password
            </label>

            <button class="login-button" type="submit">Sign In →</button>
        </form>

        <div class="login-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create account</a>
        </div>

        <div class="login-security">🔒 Secure access to your files</div>
    </main>

    <script>
        document.getElementById("showPassword").addEventListener("change", function () {
            document.getElementById("password").type =
                this.checked ? "text" : "password";
        });
    </script>
</body>
</html>
